[package]
name = "shellgrid-launcher"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "ShellGrid Windows console process lifetime guardian"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
