name: Release

# 打 tag（v 开头）时触发：先跑完整检查，通过后构建 Windows 安装包并上传到 GitHub Release 草稿。
on:
  push:
    tags:
      - "v*"

# tauri-action 需要写权限来创建 Release 并上传安装包。
permissions:
  contents: write

jobs:
  verify:
    name: 检查（类型 / 测试 / Clippy）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 前端测试
        run: npm test

      - name: 前端构建
        run: npm run build

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: 构建并发布安装包
    needs: verify
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      # tauri-action 会执行 beforeBuildCommand（npm run build）+ tauri build，
      # 生成 NSIS/MSI 后上传到与当前 tag 对应的 Release 草稿。
      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ShellGrid ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
