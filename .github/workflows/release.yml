name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
defaults:
  run:
    shell: pwsh
jobs:
  verify:
    name: Windows 类型、服务和真实 ConPTY 验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/launcher -> target"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo fmt --manifest-path native\launcher\Cargo.toml -- --check
      - run: cargo test --locked --manifest-path native\launcher\Cargo.toml
      - run: cargo clippy --locked --manifest-path native\launcher\Cargo.toml --all-targets -- -D warnings
      - run: npm run build
      - run: npm run test:windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: artifacts/windows-verification.json
          if-no-files-found: ignore
  build:
    name: Electron Windows x64 安装包
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/launcher -> target"
      - name: 校验标签版本
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw '版本标签与 package.json 不一致' }
      - run: npm ci
      - run: npm run dist:win
      - name: 验证打包后的原生模块和磁盘路径
        run: node scripts\test-windows.mjs --packaged
      - name: 验证安装、后续版本升级、卸载和数据保留
        run: npm run test:installers
      - name: 记录 Release 运行时的多窗格测量
        run: npm run bench:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers-and-verification
          path: |
            release/*.exe
            release/*.msi
            artifacts/windows-verification.json
            artifacts/windows-benchmark.json
            artifacts/installer-verification.json
      - name: 创建 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($LASTEXITCODE -eq 0) { "$previous..$tag" } else { 'HEAD' }
          $notes = @(git log $range --no-merges '--pretty=format:- %s' | Where-Object { $_ -notmatch '^- (chore|ci|build):' })
          $notes += ''
          $notes += '首次从 Tauri 版迁移：先卸载旧程序再安装，保留 %LOCALAPPDATA%\ShellGrid 中的数据。详见仓库迁移说明。'
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), ($notes -join [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          gh release create $tag --draft --title "ShellGrid $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw '创建 Release 草稿失败' }
          $installers = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object FullName)
          gh release upload $tag @installers
          if ($LASTEXITCODE -ne 0) { throw '上传安装包失败' }
