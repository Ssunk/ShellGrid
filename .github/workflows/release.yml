name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
defaults:
  run:
    shell: pwsh
  build:
    name: Electron Windows x64 MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 校验标签版本
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw '版本标签与 package.json 不一致' }
      - run: npm ci
      - name: 构建 Windows MSI
        run: |
          npm run build
          npm exec -- electron-builder --win msi --x64
      - uses: actions/upload-artifact@v4
        with:
          name: shellgrid-windows-msi
          path: |
            release/*.msi
          if-no-files-found: error
      - name: 创建 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($LASTEXITCODE -eq 0) { "$previous..$tag" } else { 'HEAD' }
          $notes = @(git log $range --no-merges '--pretty=format:- %s' | Where-Object { $_ -notmatch '^- (chore|ci|build):' })
          $notes += ''
          $notes += '首次从 Tauri 版迁移：先卸载旧程序再安装，保留 %LOCALAPPDATA%\ShellGrid 中的数据。详见仓库迁移说明。'
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), ($notes -join [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          gh release create $tag --draft --title "ShellGrid $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw '创建 Release 草稿失败' }
          $installers = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -eq '.msi' } | ForEach-Object FullName)
          if ($installers.Count -ne 1) { throw 'MSI 构建产物数量不正确' }
          gh release upload $tag @installers
          if ($LASTEXITCODE -ne 0) { throw '上传安装包失败' }
